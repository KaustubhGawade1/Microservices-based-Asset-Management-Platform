services:
  db:
    image: postgres:14-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springnet

  config-service:
    build: ./config-server
    container_name: config-server
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - springnet

  eureka:
    build: ./service-reg
    container_name: eureka
    ports:
      - "8761:8761"
    depends_on:
      - config-service
    networks:
      - springnet

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8090:8090"
    depends_on:
      - eureka
      - auth-service
      - asset-service
      - admin-service
      - ai-agent-service
      - mcp-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - springnet

  admin-service:
    build: ./admin-service
    container_name: admin-service
    ports:
      - "8089:8089"
    depends_on:
      - db
      - eureka
    networks:
      - springnet

  asset-service:
    build: ./asset-service
    container_name: asset-service
    ports:
      - "8085:8085"
    environment:
      - UPLOAD_PATH=/data/uploads
    depends_on:
      - db
      - eureka
    volumes:
      - asset_uploads:/data/uploads
    networks:
      - springnet

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - springnet

  ollama-model-loader:
    image: ollama/ollama:latest
    container_name: ollama-model-loader
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 5 && ollama pull llama3.2:3b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - springnet

  ai-agent-service:
    build: ./ai-agent-service
    container_name: ai-agent-service
    ports:
      - "8091:8091"
    depends_on:
      ollama-model-loader:
        condition: service_completed_successfully
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - MCP_SERVICE_URL=http://mcp-service:8092
      - RABBITMQ_HOST=rabbitmq
    networks:
      - springnet

  mcp-service:
    build: ./mcp-service
    container_name: mcp-service
    ports:
      - "8092:8092"
    depends_on:
      - asset-service
    environment:
      - ASSET_SERVICE_URL=http://asset-service:8085
    networks:
      - springnet

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - springnet

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      - db
      - eureka
    networks:
      - springnet

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    depends_on:
      - db
    networks:
      - springnet

volumes:
  postgres_data:
  asset_uploads:
  ollama_models:


networks:
  springnet:
    driver: bridge
