spring.application.name=gateway-service
server.port=8090

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

#eureka
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# (Optional) prefer IP address instead of hostname
eureka.instance.prefer-ip-address=true
#zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

#configserver
#spring.config.import=optional:configserver:http://config-server:8080/
spring.cloud.config.enabled=false


# ------------------------------
# AUTH SERVICE ROUTES
# ------------------------------
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/signin

# ------------------------------
# ASSET SERVICE ROUTES
# ------------------------------
spring.cloud.gateway.routes[1].id=asset-service
spring.cloud.gateway.routes[1].uri=http://asset-service:8085
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/upload

# ------------------------------
# ADMIN SERVICE ROUTES
# ------------------------------
spring.cloud.gateway.routes[2].id=admin-service
spring.cloud.gateway.routes[2].uri=http://admin-service:8089
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/admin/assets/**

# Root logger: sets the default level for everything


# Core Spring Cloud Gateway logs (filters, predicates, route matching)
logging.level.org.springframework.cloud.gateway=TRACE

# RouteDefinitionLocator: shows how routes are discovered and loaded
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO

# ===============================
# Resilience4J Circuit Breaker Config
# ===============================
resilience4j.circuitbreaker.instances.companyBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.companyBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.companyBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.companyBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.companyBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.companyBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.companyBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.companyBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.companyBreaker.sliding-window-type=count_based

# ===============================
# Actuator Configuration
# ===============================
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
