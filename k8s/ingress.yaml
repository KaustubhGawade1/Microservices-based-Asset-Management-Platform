apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8081
      - path: /api/upload
        pathType: Prefix
        backend:
          service:
            name: asset-service
            port:
              number: 8085
      - path: /api/admin/assets
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 8089
